# The buzz. Runs every quarter hour and sends the push for any card that has
# just been delivered. Nothing of ours is running on the phone when post
# arrives, so the system has to be told — same reason Carnet arranged its
# notifications in advance.
name: buzz
on:
  schedule:
    - cron: '*/15 * * * *'   # every quarter hour; the script decides what is due
  workflow_dispatch:
    inputs:
      card:
        description: 'Card id to send right now, whatever the clock says'
        required: false
      text:
        description: 'Or a one-off message to buzz instead'
        required: false
      to:
        description: 'Which door: a label such as test, or all'
        required: false
        default: 'test'
permissions:
  contents: write
# One at a time, so two runs cannot both find a card unsent.
concurrency:
  group: buzz
  cancel-in-progress: false
jobs:
  buzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund web-push@3
      - run: node scripts/buzz.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          CARD: ${{ inputs.card }}
          TEXT: ${{ inputs.text }}
          TO: ${{ inputs.to }}
      # Remember what went, so it never goes twice.
      - run: |
          if [ -n "$(git status --porcelain sent)" ]; then
            git config user.name "bee-post[bot]"
            git config user.email "bee-post@users.noreply.github.com"
            git add sent
            git commit -q -m "Sent: $(ls sent | tr '\n' ' ')"
            git pull --rebase -q && git push -q
          fi
