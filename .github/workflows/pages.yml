name: pages
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The bee is one bee in one place, or the deploy does not happen.
      - run: node -e "const p=require('./site/trip.js').check(); if(p.length){console.error(p.join('\n'));process.exit(1)} console.log('schedule ok')"
      # The service worker's cache is keyed by commit, so every deploy is a new shell.
      - run: sed -i "s/bee-post-v[0-9a-z]*/bee-post-${GITHUB_SHA::8}/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
